# Download sources
sources:
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: main
    repo_dir: gems

# You can specify local directories as sources also.
# - type: local
#   path: path/to/your/local/repository

# A directory to install the downloaded RBSs
path: .gem_rbs_collection

gems:
  # The git checkout includes generated signatures that are not part of the
  # packaged gem and reference undeclared Pagy/Alba types.
  - name: federails
    ignore: true
  # Pin pundit explicitly: it reaches the project only as a transitive dependency
  # of federails, so `federails: ignore: true` above otherwise drops it from the
  # collection. Pundit's own RBS types `authorize`/`policy_scope` generically,
  # which the empty shim here cannot replace.
  - name: pundit
