# lefthook.yml
pre-commit:
  # 훅이 하나뿐이라 병렬 여부는 지금 무의미하지만, 인덱스를 만지는 훅을
  # 추가할 때를 대비해 순차 실행을 유지한다. (과거 rubocop의 stage_fixed와
  # rbs 훅의 git add가 동시에 .git/index.lock을 잡고 경합했다.)
  parallel: false
  commands:
    # 스테이징한 .rb 파일만 자동 수정하고, 수정 결과를 이번 커밋에 포함한다.
    #
    # --force-exclusion 이 없으면 .rubocop.yml 의 AllCops/Exclude 가 무시된다.
    # RuboCop 은 파일을 인자로 명시하면 "사용자가 일부러 지목했다"고 보고 제외
    # 목록을 건너뛰기 때문이다. 여기서는 항상 경로를 넘기므로 app/components,
    # app/views, lib 전체가 검사 대상이 되어 `bundle exec rubocop` 과 결과가
    # 갈렸다. -A 는 unsafe 수정까지 하므로 제외 대상인 vendored 컴포넌트가
    # 조용히 재포맷되기도 했다.
    rubocop:
      glob: "*.{rb,rake,gemspec}"
      run: bundle exec rubocop -A --force-exclusion {staged_files}
      stage_fixed: true

    # 젬을 올리면 sorbet/rbi/gems 가 같이 늙는다. `srb tc` 는 거기 있는 파일을
    # 그냥 읽을 뿐 Gemfile.lock 과 맞는지 묻지 않으므로 드리프트가 로컬에서는
    # 완전히 보이지 않고, CI 의 `tapioca gem --verify` 에서야 터진다. 실제로
    # 젬 12개가 버전업된 채 옛 RBI 를 달고 머지됐다.
    #
    # Gemfile.lock 이 스테이징될 때만 돈다(평상시 커밋에는 비용 0).
    # 검증만 하고 RBI 를 다시 만들지도, `git add` 하지도 않는다 — 훅이 인덱스를
    # 만지면 위 rubocop 훅과 .git/index.lock 을 두고 경합한다(과거 사례).
    # 실패하면 `bin/tapioca gem` 을 돌려 결과를 같은 커밋에 담으면 된다.
    tapioca-gem-drift:
      glob: "Gemfile.lock"
      run: bundle exec tapioca gem --verify
