---
openapi: 3.0.1
info:
  title: RubyNews API
  version: v1
  description: |
    RubyNews API provides access to curated tech news articles.

    ## Authentication
    This API uses JWT Bearer token authentication. After signing in via OAuth or email,
    include the access token in the `Authorization` header:
    ```
    Authorization: Bearer <access_token>
    ```
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearer_auth: []
paths:
  "/account/edit":
    get:
      summary: 현재 사용자 정보 조회
      tags:
      - Account
      description: 현재 로그인된 사용자의 프로필 정보를 반환합니다. 인증이 필요합니다.
      security:
      - bearer_auth: []
      responses:
        '200':
          description: 사용자 정보 반환 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                        nullable: true
                      username:
                        type: string
                        nullable: true
                      unconfirmed_email:
                        type: string
                        nullable: true
                      confirmed_at:
                        type: string
                        format: date-time
                        nullable: true
                      likees_count:
                        type: integer
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                      avatar_url:
                        type: string
                        nullable: true
                    required:
                    - id
                    - email
                    - likees_count
                    - created_at
                    - updated_at
                required:
                - user
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
  "/api/v1/articles":
    get:
      summary: 기사 목록 조회
      tags:
      - Articles
      description: 확인된(confirmed) 기사 목록을 페이지네이션과 함께 반환합니다.
      security: []
      parameters:
      - name: search
        in: query
        required: false
        description: 검색 키워드 (제목/내용 기반 풀텍스트 검색)
        schema:
          type: string
      responses:
        '200':
          description: 기사 목록 반환 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  articles:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        title:
                          type: string
                        title_ko:
                          type: string
                          nullable: true
                        url:
                          type: string
                        host:
                          type: string
                        is_related:
                          type: boolean
                        likers_count:
                          type: integer
                        posts_count:
                          type: integer
                        published_at:
                          type: string
                          format: date-time
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        summary_key:
                          type: array
                          items:
                            type: string
                        tags:
                          type: array
                          items:
                            type: string
                        liked:
                          type: boolean
                        boosted:
                          type: boolean
                        boosts_count:
                          type: integer
                      required:
                      - slug
                      - title
                      - url
                      - host
                      - is_related
                      - likers_count
                      - posts_count
                      - created_at
                      - updated_at
                      - tags
                      - liked
                      - boosted
                      - boosts_count
                  pagination:
                    type: object
                    properties:
                      page:
                        type: string
                        nullable: true
                        description: keyset 페이지네이션 커서 (nullable)
                      next_page:
                        type: string
                        nullable: true
                        description: 다음 페이지 keyset 커서
                      limit:
                        type: integer
                    required:
                    - limit
                required:
                - articles
                - pagination
  "/api/v1/articles/others":
