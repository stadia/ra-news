  "/login":
    post:
      summary: 로그인
      tags:
      - Authentication
      description: |
        이메일과 비밀번호로 로그인하여 JWT 액세스 토큰과 리프레시 토큰을 발급받습니다.

        응답 헤더 `Authorization`에 Bearer 토큰이 포함됩니다.
