  "/api/v1/auth/refresh":
    post:
      summary: 액세스 토큰 갱신
      tags:
      - Authentication
      description: |
        리프레시 토큰을 사용하여 새로운 액세스 토큰을 발급받습니다.
        기존 리프레시 토큰은 폐기(revoke)되고, 새 리프레시 토큰이 함께 발급됩니다.

        ## 응답 필드
        - `access_token`: 새 JWT 액세스 토큰
        - `refresh_token`: 새 리프레시 토큰
        - `expires_in`: 액세스 토큰 만료 시간 (초)
      security: []
      parameters: []
      responses:
        '200':
          description: 토큰 갱신 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT 액세스 토큰
                  refresh_token:
                    type: string
                    description: 새 리프레시 토큰
                  expires_in:
                    type: integer
                    description: 액세스 토큰 만료 시간(초)
                required:
                - access_token
                - refresh_token
                - expires_in
        '401':
          description: 유효하지 않은 리프레시 토큰
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: 유효한 리프레시 토큰
              required:
              - refresh_token
  "/api/v1/articles/{article_id}/boost":
    post:
      summary: 기사 부스트
      tags:
      - Boosts
      description: 지정된 기사를 부스트(공유)합니다. 인증이 필요합니다.
      security:
      - bearer_auth: []
      parameters:
      - name: article_id
        in: path
        required: true
        description: 기사 slug
        schema:
          type: string
      responses:
        '201':
          description: 부스트 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  boostable_type:
                    type: string
                  boostable_slug:
                    type: string
                  boosted:
                    type: boolean
                  boosts_count:
