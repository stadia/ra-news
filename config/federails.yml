---
defaults: &defaults
  app_name: ruby-news.kr
  app_version: 1.0
  force_ssl: false
  site_host: http://localhost
  site_port: 3000
  enable_discovery: true
  open_registrations: true
  app_layout: "layouts/federails/application"
  client_routes_path: app
  server_routes_path: federation
  #remote_entities_cache_duration: 86400 # 1 day in seconds
  base_client_controller: Federails::ApplicationController

development:
  <<: *defaults

test:
  <<: *defaults
  site_port: null

production:
  <<: *defaults
  force_ssl: true
  site_port: 443
  site_host: https://ruby-news.kr
