#
# This file configures the New Relic Agent.  New Relic monitors Ruby, Java,
# .NET, PHP, Python, Node, and Go applications with deep visibility and low
# overhead.  For more information, visit www.newrelic.com.
#
# Generated October 28, 2022
#
# This configuration file is custom generated for NewRelic Administration
#
# For full documentation of agent configuration options, please refer to
# https://docs.newrelic.com/docs/agents/ruby-agent/installation-configuration/ruby-agent-configuration

common:
  &default_settings # Required license key associated with your New Relic account.
  license_key: <%= ENV["NEW_RELIC_LICENSE_KEY"] %>

  # Your application name. Renaming here affects where data displays in New
  # Relic.  For more details, see https://docs.newrelic.com/docs/apm/new-relic-apm/maintenance/renaming-applications
  app_name: "ruby-news"

  distributed_tracing:
    enabled: true

  # To disable the agent regardless of other settings, uncomment the following:

  # agent_enabled: false

  # Logging level for log/newrelic_agent.log
  log_level: info

  application_logging:
    enabled: true
    forwarding:
      enabled: false
    metrics:
      enabled: true
    local_decorating:
      enabled: true

  attributes:
    exclude:
      - request.parameters.password
      - request.parameters.password_confirmation
      - request.parameters.current_password
      - request.parameters.*token*
      - request.parameters.*secret*
      - request.headers.authorization
      - request.headers.cookie
      - request.headers.x-api-key

  transaction_tracer:
    record_sql: obfuscated
    transaction_threshold: apdex_f
    stack_trace_threshold: 0.3

  slow_sql:
    enabled: true
    record_sql: obfuscated
    explain_enabled: true
    explain_threshold: 0.3

  error_collector:
    capture_events: true
    max_event_samples_stored: 100
    ignore_classes:
      - ActionController::RoutingError
      - ActiveRecord::RecordNotFound
      - ActionController::InvalidAuthenticityToken
      - ActionController::UnknownFormat

  rules:
    ignore_url_regexes:
      - "^/up"
      - "^/health"
      - "^/rails/active_storage"
      - "^/cable"

# Environment-specific settings are in this section.
# RAILS_ENV or RACK_ENV (as appropriate) is used to determine the environment.
# If your application has other named environments, configure them here.
development:
  <<: *default_settings
  app_name: "ruby-news (Development)"

test:
  <<: *default_settings
  # It doesn't make sense to report to New Relic from automated test runs.
  monitor_mode: false

staging:
  <<: *default_settings
  app_name: "ruby-news (Staging)"

production:
  <<: *default_settings
  ai_monitoring.enabled: true
  span_events.max_samples_stored: 10000
  custom_insights_events.max_samples_stored: 100000
