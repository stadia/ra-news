production:
  rss_site_job:
    command: "RssSiteJob.enqueue_all"
    schedule: "0 7 * * *"
  gmail_article_job:
    command: "GmailArticleJob.enqueue_all"
    schedule: "0 10 * * 1-5"
  youtube_site_job:
    command: "YoutubeSiteJob.enqueue_all"
    schedule: "0 8 * * *"
  hacker_news_job:
    class: HackerNewsSiteJob
    schedule: "10 */2 * * *"
  rss_site_page_job:
    command: "RssSitePageJob.enqueue_all"
    schedule: "0 6 * * *"
  sitemap_refresh:
    command: "SitemapBuilder.build"
    schedule: "30 * * * 1-5"
  article_batch_job:
    class: "ArticleBatchJob"
    schedule: "*/5 * * * *"
  social_post_job:
    class: "SocialPostJob"
    schedule: "*/10 8-19 * * *"
  reddit_site_job:
    class: RedditSiteJob
    schedule: "0 */4 * * *"
  discarded_article_cleanup_job:
    class: "DiscardedArticleCleanupJob"
    schedule: "0 4 * * 0"
  japanese_temp_job:
    class: "JapaneseTempJob"
    schedule: "*/20 * * * *"
  federails_sync_hosts:
    command: "Federails::Maintenance::HostsUpdater.run"
    schedule: "15 3 * * *"
    queue: federation
