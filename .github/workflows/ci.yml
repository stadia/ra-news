name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Static only -- no database or credentials needed. The RBI files under
      # sorbet/rbi are committed, so this never regenerates them; if they drift
      # from Gemfile.lock, run `bundle exec tapioca gem` and commit the result.
      # Every file under app/lib/test now carries an explicit sigil: 296 at
      # `# typed: true` (where Sorbet enforces signatures and constant/method
      # resolution) and 185 still at `# typed: false` (syntax and RBI drift
      # only). Widen by re-running `bundle exec spoom srb bump . --dry`, which
      # lists the files that would type check cleanly at the next level up.
      #
      # A NEW file with no sigil defaults to `false` and is therefore invisible
      # to this gate -- add one when creating files.
      - name: Type check with Sorbet
        run: bundle exec srb tc

      # Steep gates the inline RBS annotations (`#:` comments) that `srb tc`
      # cannot see under `# typed: false`. The Steepfile uses `rbs collection`,
      # so install the gem RBSs before checking.
      - name: Install RBS collection
        run: bundle exec rbs collection install

      # Steep reads sig/generated/*.rbs, NOT the `#:` comments those files are
      # generated from -- so editing an annotation without regenerating leaves
      # the two silently out of sync and Steep keeps checking the stale copy.
      # Regenerate and fail if anything moved. Fix with:
      #   bundle exec rbs-inline --output app lib
      - name: Check sig/generated is in sync with inline RBS
        run: |
          bundle exec rbs-inline --output app lib
          # --porcelain, not `git diff --exit-code`: a newly annotated file
          # produces an *untracked* .rbs, which git diff does not report.
          drift="$(git status --porcelain -- sig/generated)"
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::sig/generated is stale. Run 'bundle exec rbs-inline --output app lib' and commit the result."
            exit 1
          fi

      # `steep check` asks "does the Ruby match the signatures?"; `rbs validate`
      # asks "are the signatures coherent among themselves?" -- undefined type
      # references, circular inheritance, wrong generic arity. Steep happens to
      # surface some of these today, but only for signatures reachable from the
      # files it checks, and it stops at the first failing target. This runs in
      # seconds over all of sig/ regardless.
      - name: Validate RBS signatures
        run: bundle exec rbs -I sig validate

      - name: Type check with Steep
        run: bundle exec steep check

  test:
    runs-on: ubuntu-latest

    permissions:
      packages: write

    services:
      postgres:
        image: ghcr.io/stadia/ra-pg:18
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PASSWD }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Prepare database
        env:
          RAILS_ENV: test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ra-news_test
        run: bin/rails db:create db:migrate

      # RSpec를 먼저 실행해 커버리지를 계측하고, 이어서 Minitest를 실행한다.
      # 두 스텝은 같은 job의 동일한 coverage/ 디렉토리를 공유하므로 결과가 병합되며,
      # Minitest의 at_exit(persist_result!)가 마지막에 돌아 병합된 최종 스냅샷을 저장한다.
      - name: Run RSpec with coverage
        env:
          RAILS_ENV: test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ra-news_test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          PGGSSENCMODE: disable
        run: bundle exec rspec

      - name: Run tests with coverage
        env:
          RAILS_ENV: test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ra-news_test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          PGGSSENCMODE: disable
        run: bin/rails test

