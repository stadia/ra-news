# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rbs_inline
  - rubocop-minitest
  - rubocop-i18n

AllCops:
  RubyInterpreters:
    - ruby
    - rake
  NewCops: enable
  TargetRubyVersion: 4.0
  TargetRailsVersion: 8.1
  Exclude:
    - "app/components/**/*"
    - "app/views/**/*"
    - "config/**/*"

Layout/LeadingCommentSpace:
  Enabled: false

Bundler/OrderedGems:
  Enabled: true

Metrics/ClassLength:
  Enabled: true
  Max: 200
  Exclude:
    - "test/**/*"
    - "db/**/*"
    - "spec/**/*"

Metrics/ModuleLength:
  Enabled: true
  Exclude:
    - "test/**/*"
    - "db/**/*"
    - "spec/**/*"

Metrics/MethodLength:
  Enabled: true
  Max: 100
  Exclude:
    - "test/**/*"
    - "db/**/*"
    - "db/migrate/**/*"

Metrics/AbcSize:
  Enabled: true
  Max: 100
  Exclude:
    - "test/**/*"
    - "db/**/*"

Metrics/CyclomaticComplexity:
  Enabled: true
  Max: 100
  Exclude:
    - "test/**/*"
    - "db/**/*"

Metrics/PerceivedComplexity:
  Enabled: true
  Max: 100
  Exclude:
    - "test/**/*"
    - "db/**/*"

I18n/GetText/DecorateFunctionMessage:
  Enabled: false

# Test assertions legitimately compare literal strings (e.g. expected output of
# a sanitizer/summary), so these "wrap your string for i18n" cops add noise and
# false failures there.
I18n/RailsI18n/DecorateString:
  Exclude:
    - "test/**/*"
    - "lib/tasks/search_benchmark.rake" # 벤치마크 seed fixture — 번역 대상 UI 문자열 아님
    - "app/agents/**/*" # LLM 프롬프트 — 번역 대상 UI 문자열 아님

I18n/GetText/DecorateString:
  Exclude:
    - "test/**/*"
    - "lib/tasks/search_benchmark.rake" # 벤치마크 seed fixture — 번역 대상 UI 문자열 아님
    - "app/agents/**/*" # LLM 프롬프트 — 번역 대상 UI 문자열 아님
