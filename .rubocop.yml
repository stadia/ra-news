# Omakase Ruby styling for Rails
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rbs_inline
  - rubocop-minitest
  - rubocop-i18n
  - rubocop-sorbet

AllCops:
  RubyInterpreters:
    - ruby
    - rake
  NewCops: enable
  TargetRubyVersion: 4.0
  TargetRailsVersion: 8.1
  Exclude:
    - "app/components/**/*"
    - "app/views/**/*"
    - "config/**/*"
    - "lib/**/*"

Layout/LeadingCommentSpace:
  Enabled: false

Bundler/OrderedGems:
  Enabled: true

Metrics/ClassLength:
  Enabled: true
  Max: 200
  Exclude:
    - "test/**/*"
    - "db/**/*"
    - "spec/**/*"
    # 대형 도메인 모델(연관/검색/federation/썸네일 등 다수 책임) — 길이 예외.
    - "app/models/article.rb"
    # 전역 레이아웃(head/CSP/asset preload/PWA 등 다수 책임) — 기존 부채, 길이 예외.
    - "app/components/layout.rb"

Metrics/ModuleLength:
  Enabled: true
  Exclude:
    - "test/**/*"
    - "db/**/*"
    - "spec/**/*"

Metrics/MethodLength:
  Enabled: true
  Max: 100
  Exclude:
    - "test/**/*"
    - "db/**/*"
    - "db/migrate/**/*"

Metrics/AbcSize:
  Enabled: true
  Max: 100
  Exclude:
    - "test/**/*"
    - "db/**/*"

Metrics/CyclomaticComplexity:
  Enabled: true
  Exclude:
    - "test/**/*"
    - "db/**/*"

Metrics/PerceivedComplexity:
  Enabled: true
  Exclude:
    - "test/**/*"
    - "db/**/*"

I18n/GetText/DecorateFunctionMessage:
  Enabled: false

# Test assertions legitimately compare literal strings (e.g. expected output of
# a sanitizer/summary), so these "wrap your string for i18n" cops add noise and
# false failures there.
I18n/RailsI18n/DecorateString:
  Exclude:
    - "test/**/*"
    - "spec/**/*"
    - "lib/tasks/search_benchmark.rake" # 벤치마크 seed fixture — 번역 대상 UI 문자열 아님

I18n/GetText/DecorateString:
  Exclude:
    - "test/**/*"
    - "spec/**/*"
    - "lib/tasks/search_benchmark.rake" # 벤치마크 seed fixture — 번역 대상 UI 문자열 아님

Style/SelectByKind:
  Enabled: true

Style/SelectByRange:
  Enabled: true

Style/PartitionInsteadOfDoubleSelect:
  Enabled: true

# Omakase disables the entire `Style` department (`Style: Enabled: false`),
# which silently turns off every `Style/RbsInline/*` cop shipped by the
# rubocop-rbs_inline plugin. The plugin defaults set each cop to `Enabled: true`,
# but `inherit_gem` config wins over plugin defaults, so we override the plugin
# cops back on explicitly.
Style/RbsInline:
  Enabled: true
Style/RbsInline/DataClassCommentAlignment:
  Enabled: true
Style/RbsInline/EmbeddedRbsSpacing:
  Enabled: true
Style/RbsInline/InvalidComment:
  Enabled: true
Style/RbsInline/KeywordSeparator:
  Enabled: true
Style/RbsInline/MethodCommentSpacing:
  Enabled: true
# 이 cop이 요구하는 표기(`Data.define(:path, #: String)`)는 Sorbet과 양립하지 않는다.
# Sorbet은 `--enable-experimental-rbs-comments` 아래에서 줄 끝 `#:`를 "그 줄 표현식에
# 대한 타입 단언"으로 읽으므로, 인자 줄의 주석은 멤버 선언이 아니라 `:path` 심볼이
# `String`이라는 단언이 되어 `srb tc`가 깨진다. 멤버 타입은 대신
# sorbet/rbi/shims/data_definitions.rbi 에 둔다. 배경은 AGENTS.md 참고.
Style/RbsInline/MissingDataClassAnnotation:
  Enabled: false
Style/RbsInline/ParametersSeparator:
  Enabled: true
Style/RbsInline/RedundantAnnotationWithSkip:
  Enabled: true
Style/RbsInline/RedundantInstanceVariableAnnotation:
  Enabled: true
Style/RbsInline/RedundantTypeAnnotation:
  Enabled: true
Style/RbsInline/RequireRbsInlineComment:
  Enabled: true
  Exclude:
    - "app/components/**/*"
    - "app/controllers/madmin/**/*"
    - "app/madmin/**/*"
    - "app/views/**/*"
    - "db/**/*"
    - "script/*"
    - "*file"
    - "config.ru"
    - ".*"
    - "test/**/*"
    - "spec/**/*"
Style/RbsInline/UnmatchedAnnotations:
  Enabled: true
Style/RbsInline/VariableCommentSpacing:
  Enabled: true
Style/RbsInline/DataDefineWithBlock:
  Enabled: true
Style/RbsInline/InvalidTypes:
  Enabled: true
  Exclude:
    - sorbet/**/*

Style/RbsInline/UntypedInstanceVariable:
  Enabled: false
Style/RbsInline/MissingTypeAnnotation:
  Enabled: false

Sorbet/BlockMethodDefinition:
  Enabled: false
# 이 cop은 줄 끝 `#: String` 을 "Sorbet이 어차피 추론하는 T.let" 으로 보고 지우라고
# 하지만, 이 프로젝트에서 `#:` 는 rbs-inline 주석이다. 상수의 타입 선언은 이 주석이
# 유일한 출처이므로 지우면 타입 정보가 사라진다. 같은 이유로 꺼둔 Style/RbsInline/*
# 항목들과 궤를 같이한다.
Sorbet/RedundantTLetForLiteral:
  Enabled: false
Sorbet/FalseSigil:
  Enabled: true
  Exclude:
    - "test/**/*"
    - "spec/**/*"
